name: pages

# Deploy the public landing page in site/ to GitHub Pages. Only the page, its
# stylesheet, and the assets it references are staged, so nothing else in the
# repository is published.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _site/assets
          cp site/index.html site/styles.css _site/
          cp assets/pry-mark.svg assets/pry-logo.svg \
             assets/pry-demo.gif assets/pry-demo.mp4 assets/pry-demo-scan.png \
             assets/social-card.png _site/assets/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
