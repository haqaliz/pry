<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="630" viewBox="0 0 1280 630">
  <rect width="1280" height="630" fill="#0b1116"/>
  <rect x="0" y="0" width="8" height="630" fill="#fe0100"/>
  <g transform="translate(80 92)">
    <image href="pry-mark.svg" width="150" height="138"/>
  </g>
  <text x="232" y="168" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#f4f7f9">Pry</text>
  <text x="236" y="214" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#f4f7f9">Prove it. Don't guess it.</text>
  <text x="236" y="252" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#9fb0bc">Reproduce it. Sign the proof.</text>
  <g font-family="Menlo, Consolas, monospace">
    <rect x="660" y="96" width="540" height="368" rx="12" fill="#070c10" stroke="#24313a"/>
    <rect x="660" y="96" width="540" height="38" rx="12" fill="#111a21"/>
    <circle cx="684" cy="115" r="5" fill="#ff5f57"/>
    <circle cx="702" cy="115" r="5" fill="#febc2e"/>
    <circle cx="720" cy="115" r="5" fill="#28c840"/>
    <text x="688" y="168" font-size="15" fill="#ff4d4f">$ pry scan ./my-app</text>
    <text x="688" y="202" font-size="15" fill="#e6edf3">cors: <tspan fill="#ff4d4f">EXPOSED</tspan></text>
    <text x="688" y="232" font-size="15" fill="#e6edf3">errors: <tspan fill="#ff4d4f">EXPOSED</tspan></text>
    <text x="688" y="262" font-size="15" fill="#e6edf3">secrets: <tspan fill="#ff4d4f">EXPOSED</tspan></text>
    <text x="688" y="292" font-size="15" fill="#e6edf3">database: <tspan fill="#ff4d4f">EXPOSED</tspan></text>
    <text x="688" y="330" font-size="13" fill="#9fb0bc">Results: ~/.pry/runs/&lt;id&gt;/results.json</text>
    <text x="688" y="356" font-size="13" fill="#9fb0bc">Report:  ~/.pry/runs/&lt;id&gt;/report.html</text>
    <text x="688" y="392" font-size="13" fill="#28c840">$ pry verify-proof $PROOF</text>
    <text x="688" y="418" font-size="13" fill="#e6edf3">VALID  sha256:e4d0ce9e...</text>
  </g>
  <text x="80" y="520" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#9fb0bc">Ownership-gated. Read-only by default. Signed, replayable proof.</text>
  <text x="80" y="558" font-family="Menlo, Consolas, monospace" font-size="17" fill="#ff4d4f">github.com/haqaliz/pry</text>
  <text x="80" y="590" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#66757f">Apache-2.0  ·  Python 3.9+  ·  v0.1.0</text>
</svg>
