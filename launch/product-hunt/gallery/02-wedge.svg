<text x="172" y="98" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#eef3f6">PRY</text>
<text x="172" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ff4d4f">WHY PRY</text>
<text x="72" y="236" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#eef3f6" letter-spacing="-2">The exploit</text>
<text x="72" y="306" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#eef3f6" letter-spacing="-2">is the verdict.</text>
<text x="72" y="360" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#9fb0bc">Most scanners say an endpoint looks risky.</text>
<text x="72" y="394" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#9fb0bc">Pry makes the request that should have been</text>
<text x="72" y="428" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#9fb0bc">blocked, captures what came back, and signs it.</text>
<text x="72" y="704" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#66757f">Execution decides. A heuristic may prioritize.</text>
<rect x="72" y="494" width="360" height="150" rx="10" fill="#101820" stroke="#22303a"/>
<text x="94" y="534" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#ff4d4f">01</text>
<text x="94" y="574" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#eef3f6">Execute</text>
<text x="94" y="606" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#9fb0bc">A real request against a target you own.</text>
<rect x="462" y="494" width="360" height="150" rx="10" fill="#101820" stroke="#22303a"/>
<text x="484" y="534" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#ff4d4f">02</text>
<text x="484" y="574" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#eef3f6">Capture</text>
<text x="484" y="606" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#9fb0bc">The exact pair, redacted and capped.</text>
<rect x="852" y="494" width="360" height="150" rx="10" fill="#101820" stroke="#22303a"/>
<text x="874" y="534" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#ff4d4f">03</text>
<text x="874" y="574" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#eef3f6">Sign</text>
<text x="874" y="606" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#9fb0bc">An Ed25519 bundle you can verify offline.</text>
</svg>