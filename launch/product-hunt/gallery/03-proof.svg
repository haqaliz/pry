<text x="632" y="248" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#ff4d4f">$ pry verify-proof $PROOF</text>
<text x="632" y="278" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#28c840">VALID</text>
<text x="632" y="308" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#eef3f6">Fingerprint: sha256:e4d0ce9e...</text>
<text x="632" y="338" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#eef3f6">Probe: database</text>
<text x="632" y="368" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#ff4d4f">Verdict: EXPOSED</text>
<text x="632" y="398" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#eef3f6">Target: ./my-app (node)</text>
</g>
