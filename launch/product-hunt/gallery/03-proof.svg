<text x="172" y="98" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#eef3f6">PRY</text>
<text x="172" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ff4d4f">PROOF</text>
<text x="72" y="236" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#eef3f6" letter-spacing="-2">Verify it</text>
<text x="72" y="306" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#eef3f6" letter-spacing="-2">offline.</text>
<text x="72" y="360" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#9fb0bc">Every EXPOSED finding carries a signed bundle</text>
<text x="72" y="394" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#9fb0bc">with the target snapshot, the redacted pair,</text>
<text x="72" y="428" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#9fb0bc">and a fingerprint you can pin out of band.</text>
<text x="72" y="704" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#66757f">No upload. No telemetry. The proof stays local.</text>
<g>
<rect x="610" y="180" width="588" height="390" rx="12" fill="#070c10" stroke="#22303a"/>
