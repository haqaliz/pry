<text x="172" y="98" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#eef3f6">PRY</text>
<text x="172" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ff4d4f">SAFETY</text>
<text x="72" y="236" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#eef3f6" letter-spacing="-2">Ownership first.</text>
<text x="72" y="306" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#eef3f6" letter-spacing="-2">No 'secure' claim.</text>
<text x="72" y="360" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#9fb0bc">Live targets need DNS TXT or well-known-file</text>
<text x="72" y="394" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#9fb0bc">proof. Read-only is the default; higher</text>
<text x="72" y="428" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#9fb0bc">intensity needs explicit confirmation.</text>
<text x="72" y="704" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#66757f">github.com/haqaliz/pry/blob/master/ETHICS.md</text>
<text x="72" y="500" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#28c840">✓</text>
<text x="104" y="500" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#eef3f6">Ownership proof before any live request</text>
<text x="72" y="546" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#28c840">✓</text>
<text x="104" y="546" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#eef3f6">Local repo runs in a disposable Docker sandbox</text>
<text x="72" y="592" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#28c840">✓</text>
<text x="104" y="592" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#eef3f6">No third-party scanning. No upload.</text>
<text x="72" y="638" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#28c840">✓</text>
<text x="104" y="638" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#eef3f6">A clean result is NOT_REPRODUCED, never safe.</text>
</svg>