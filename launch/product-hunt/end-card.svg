<text x="196" y="112" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#eef3f6">Pry</text>
<text x="80" y="270" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#eef3f6">Try it on your own app.</text>
<text x="80" y="318" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#9fb0bc">One command. A real request. A signed proof.</text>
<rect x="80" y="376" width="760" height="96" rx="10" fill="#070c10" stroke="#22303a"/>
<text x="106" y="418" font-family="Menlo, Consolas, monospace" font-size="18" fill="#ff4d4f">$ uv tool install pry-scanner</text>
<text x="106" y="450" font-family="Menlo, Consolas, monospace" font-size="18" fill="#eef3f6">$ pry scan ./my-app --report</text>
<text x="80" y="560" font-family="Menlo, Consolas, monospace" font-size="20" fill="#ff4d4f">github.com/haqaliz/pry</text>
<text x="80" y="596" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#66757f">Apache-2.0 · Open source · No upload by default</text>
<text x="80" y="664" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#eef3f6">Prove it. Don't guess it.</text>
