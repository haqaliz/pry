[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pry-scanner"
version = "0.1.0"
description = "Pry - Proves an app you own is exposed by actually trying the exploit"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "haqaliz"}]
requires-python = ">=3.9"
keywords = ["security", "scanner", "exposure", "proof", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
    "cryptography>=42,<47",
    "dnspython>=2.6,<3",
]

[dependency-groups]
dev = ["pytest>=7,<9"]

[project.scripts]
pry = "pry.cli:main"

[project.urls]
Homepage = "https://github.com/haqaliz/pry"
Repository = "https://github.com/haqaliz/pry"
Issues = "https://github.com/haqaliz/pry/issues"
Changelog = "https://github.com/haqaliz/pry/blob/master/CHANGELOG.md"
Security = "https://github.com/haqaliz/pry/blob/master/SECURITY.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["docker: requires Docker and PRY_DOCKER_TESTS=1"]
