[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pry"
version = "0.1.0"
description = "Pry - Proves an app you own is exposed by actually trying the exploit"
requires-python = ">=3.9"
dependencies = ["dnspython>=2.6,<3"]

[dependency-groups]
dev = ["pytest>=7,<9"]

[project.scripts]
pry = "pry.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
